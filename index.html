<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>s_arn77 | روابط التواصل</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc; /* خلفية بيضاء ساطعة ونظيفة */
            color: #0f172a; /* نص داكن وواضح */
            margin: 0;
            padding: 0;
        }
        /* Light Glassmorphism Box */
        .glass-icon-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-icon-box:hover {
            background: rgba(255, 255, 255, 1);
            border-color: rgba(14, 165, 233, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px -5px rgba(14, 165, 233, 0.15);
        }
        /* Soft Glow Animation for Moon Avatar */
        @keyframes pulseGlowLight {
            0%, 100% {
                box-shadow: 0 0 25px rgba(14, 165, 233, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.05);
            }
            50% {
                box-shadow: 0 0 45px rgba(14, 165, 233, 0.3), inset 0 0 25px rgba(0, 0, 0, 0.1);
            }
        }
        .moon-glow {
            animation: pulseGlowLight 4s infinite ease-in-out;
        }
        /* Floating Subtle Dots Background */
        .dot-bg {
            position: absolute;
            background: #cbd5e1;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between relative selection:bg-sky-500 selection:text-white py-12 px-4 box-border">

    <!-- Background Dots Container -->
    <div id="stars-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Background Ambient Glows -->
    <div class="absolute top-1/4 -left-20 w-72 h-72 bg-sky-200/50 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 -right-20 w-72 h-72 bg-indigo-200/50 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Container Card -->
    <main class="w-full max-w-xs z-10 flex flex-col items-center mx-auto">

        <!-- Profile Section -->
        <div class="text-center mb-8 w-full flex flex-col items-center">
            <!-- Moon Avatar with glowing effect -->
            <div class="relative w-28 h-28 mb-4 rounded-full overflow-hidden moon-glow border-2 border-slate-200 p-1 bg-white">
                <img src="moon.jpg" alt="s_arn77 Moon Avatar" class="w-full h-full object-cover rounded-full transform hover:scale-110 transition duration-700" onerror="this.src='https://placehold.co/400x400/f1f5f9/0f172a?text=s_arn77'">
                <div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent pointer-events-none"></div>
            </div>

            <!-- Username & Badge -->
            <h1 class="text-2xl font-bold text-slate-900 tracking-wide flex items-center justify-center gap-2">
                s_arn77
                <span class="text-sky-500 text-base" title="موثق"><i class="fa-solid fa-circle-check"></i></span>
            </h1>
        </div>

        <!-- Icons Grid Container (Compact & Clean) -->
        <div class="w-full grid grid-cols-2 gap-4">

            <!-- X Icon Link (Dark X on light background) -->
            <a href="https://x.com/s_arn77?s=11" target="_blank" rel="noopener noreferrer" 
               class="glass-icon-box rounded-2xl p-4 flex flex-col items-center justify-center gap-2 group">
                <div class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-white text-xl font-black tracking-tighter group-hover:scale-110 transition-all">
                    𝕏
                </div>
                <span class="text-xs font-bold text-slate-700 group-hover:text-slate-900 transition-colors">X</span>
            </a>

            <!-- TikTok Icon Link -->
            <a href="https://www.tiktok.com/@s_arn77" target="_blank" rel="noopener noreferrer" 
               class="glass-icon-box rounded-2xl p-4 flex flex-col items-center justify-center gap-2 group">
                <div class="w-12 h-12 rounded-xl bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-500 text-xl group-hover:scale-110 transition-all">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <span class="text-xs font-bold text-slate-700 group-hover:text-pink-600 transition-colors">TikTok</span>
            </a>

            <!-- Snapchat Icon Link -->
            <a href="https://www.snapchat.com/add/s_arn77?share_id=d11fyDMGSPOh6Cl8KtllyA&locale=ar_SA@calendar=gregorian;numbers=latn" target="_blank" rel="noopener noreferrer" 
               class="glass-icon-box rounded-2xl p-4 flex flex-col items-center justify-center gap-2 group">
                <div class="w-12 h-12 rounded-xl bg-yellow-400/20 border border-yellow-400/30 flex items-center justify-center text-yellow-600 text-xl group-hover:scale-110 transition-all">
                    <i class="fa-brands fa-snapchat"></i>
                </div>
                <span class="text-xs font-bold text-slate-700 group-hover:text-yellow-600 transition-colors">Snapchat</span>
            </a>

            <!-- WhatsApp Icon Link -->
            <a href="https://wa.me/966569557991?s=p" target="_blank" rel="noopener noreferrer" 
               class="glass-icon-box rounded-2xl p-4 flex flex-col items-center justify-center gap-2 group">
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-600 text-xl group-hover:scale-110 transition-all">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <span class="text-xs font-bold text-slate-700 group-hover:text-emerald-600 transition-colors">WhatsApp</span>
            </a>

        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-10 text-center text-xs text-slate-400 z-10">
        <p>© 2026 s_arn77. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- JavaScript to generate subtle background dots -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("stars-container");
            const starCount = 30;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement("div");
                star.className = "dot-bg";
                
                const x = Math.random() * 98;
                const y = Math.random() * 100;
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;

                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                const duration = Math.random() * 3 + 2;
                star.style.setProperty("--duration", `${duration}s`);

                star.style.animationDelay = `${Math.random() * 3}s`;

                container.appendChild(star);
            }
        });
    </script>
</body>
</html>
