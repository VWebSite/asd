<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>s_arn77 | روابط التواصل</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        /* Glassmorphism Icon Button */
        .glass-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }
        .glass-icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(56, 189, 248, 0.3);
        }
        /* Moon Glow Animation */
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 30px rgba(147, 197, 253, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.1);
            }
            50% {
                box-shadow: 0 0 50px rgba(147, 197, 253, 0.4), inset 0 0 30px rgba(255, 255, 255, 0.2);
            }
        }
        .moon-glow {
            animation: pulseGlow 4s infinite ease-in-out;
        }
        /* Floating Stars Background */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between relative selection:bg-sky-500 selection:text-white py-12 px-4">

    <!-- Background Stars Container -->
    <div id="stars-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Background Ambient Glows -->
    <div class="absolute top-1/4 -left-32 w-96 h-96 bg-indigo-900/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 -right-32 w-96 h-96 bg-sky-900/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Container Card -->
    <main class="w-full max-w-md z-10 flex flex-col items-center">

        <!-- Profile Section -->
        <div class="text-center mb-10 w-full flex flex-col items-center">
            <!-- Moon Avatar with glowing effect -->
            <div class="relative w-32 h-32 mb-5 rounded-full overflow-hidden moon-glow border-2 border-white/20 p-1 bg-slate-900">
                <img src="moon.jpg" alt="s_arn77 Moon Avatar" class="w-full h-full object-cover rounded-full transform hover:scale-110 transition duration-700" onerror="this.src='https://placehold.co/400x400/0f172a/ffffff?text=s_arn77'">
                <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent pointer-events-none"></div>
            </div>

            <!-- Username & Badge -->
            <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-wide flex items-center justify-center gap-2">
                s_arn77
                <span class="text-sky-400 text-lg" title="موثق"><i class="fa-solid fa-circle-check"></i></span>
            </h1>
        </div>

        <!-- Icons Grid Container -->
        <div class="w-full grid grid-cols-2 gap-4 max-w-xs mx-auto">

            <!-- X (Twitter) Icon Link -->
            <a href="https://x.com/s_arn77?s=11" target="_blank" rel="noopener noreferrer" 
               class="glass-icon-btn aspect-square rounded-3xl flex flex-col items-center justify-center gap-2 group">
                <div class="w-16 h-16 rounded-2xl bg-black/40 border border-white/10 flex items-center justify-center text-white text-2xl group-hover:bg-black group-hover:border-white/30 group-hover:scale-110 transition-all duration-300">
                    <i class="fa-brands fa-x-twitter"></i>
                </div>
            </a>

            <!-- TikTok Icon Link -->
            <a href="https://www.tiktok.com/@s_arn77" target="_blank" rel="noopener noreferrer" 
               class="glass-icon-btn aspect-square rounded-3xl flex flex-col items-center justify-center gap-2 group">
                <div class="w-16 h-16 rounded-2xl bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-400 text-2xl group-hover:bg-pink-500/20 group-hover:scale-110 transition-all duration-300">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
            </a>

            <!-- Snapchat Icon Link -->
            <a href="https://www.snapchat.com/add/s_arn77?share_id=d11fyDMGSPOh6Cl8KtllyA&locale=ar_SA@calendar=gregorian;numbers=latn" target="_blank" rel="noopener noreferrer" 
               class="glass-icon-btn aspect-square rounded-3xl flex flex-col items-center justify-center gap-2 group">
                <div class="w-16 h-16 rounded-2xl bg-yellow-400/10 border border-yellow-400/20 flex items-center justify-center text-yellow-400 text-2xl group-hover:bg-yellow-400/20 group-hover:scale-110 transition-all duration-300">
                    <i class="fa-brands fa-snapchat"></i>
                </div>
            </a>

            <!-- WhatsApp Icon Link -->
            <a href="https://wa.me/966569557991?s=p" target="_blank" rel="noopener noreferrer" 
               class="glass-icon-btn aspect-square rounded-3xl flex flex-col items-center justify-center gap-2 group">
                <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-2xl group-hover:bg-emerald-500/20 group-hover:scale-110 transition-all duration-300">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
            </a>

        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-slate-500 z-10">
        <p>© 2026 s_arn77. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- JavaScript to generate random background stars -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("stars-container");
            const starCount = 50;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement("div");
                star.className = "star";
                
                // Random positioning
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;

                // Random size
                const size = Math.random() * 2.5 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                // Random animation duration
                const duration = Math.random() * 3 + 2;
                star.style.setProperty("--duration", `${duration}s`);

                // Random animation delay
                star.style.animationDelay = `${Math.random() * 3}s`;

                container.appendChild(star);
            }
        });
    </script>
</body>
</html>
