    <style>
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: 'Cairo', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        /* Sleek Glass Bar Effect */
        .glass-bar {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-bar:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px 0 rgba(56, 189, 248, 0.15);
        }
        /* Moon Glow Animation */
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 25px rgba(147, 197, 253, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.1);
            }
            50% {
                box-shadow: 0 0 45px rgba(147, 197, 253, 0.35), inset 0 0 25px rgba(255, 255, 255, 0.2);
            }
        }
        .moon-glow {
            animation: pulseGlow 4s infinite ease-in-out;
        }
        /* Floating Stars Background */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>

    <!-- JavaScript to generate random background stars -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("stars-container");
            const starCount = 35; // تقليل العدد قليلاً ليكون خفيفاً على الجوال

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement("div");
                star.className = "star";
                
                // Random positioning (ضمان عدم خروجها عن عرض الشاشة)
                const x = Math.random() * 98;
                const y = Math.random() * 100;
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;

                // Random size
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                // Random animation duration
                const duration = Math.random() * 3 + 2;
                star.style.setProperty("--duration", `${duration}s`);

                // Random animation delay
                star.style.animationDelay = `${Math.random() * 3}s`;

                container.appendChild(star);
            }
        });
    </script>
